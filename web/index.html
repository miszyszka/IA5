<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA5 — laboratorium strategii FX</title>
<meta name="description" content="Szukanie i weryfikacja strategii FX na świecach H1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0E13'/%3E%3Cpath d='M6 22 L12 14 L17 18 L26 8' stroke='%23FF7A1A' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/echarts.min.js" defer></script>
<script src="vendor/lightweight-charts.js" defer></script>
</head>
<body>
<header class="top">
  <a class="logo" href="#/" aria-label="IA5 — strona główna">IA5</a>
  <nav aria-label="Zakładki">
    <a data-tab="strategies" href="#/">Strategie</a>
    <a data-tab="stats" href="#/stats">Stats</a>
    <a data-tab="investors" href="#/inwestorzy">Inwestorzy</a>
  </nav>
  <div id="status" class="live" aria-label="Stan systemu" aria-live="polite">
    <a class="ind" id="ind-data" href="#/stats" data-state="mute"><i class="dot"></i><b>Dane</b><span class="s">…</span></a>
    <span class="ind" id="ind-mac" data-state="mute"><i class="dot"></i><b>Mac</b><span class="s">—</span></span>
    <a class="ind" id="ind-fetch" href="#/stats" data-state="mute"><i class="dot"></i><b>Pobieranie</b><span class="s">—</span></a>
    <a class="ind flags" id="ind-flags" href="#/stats" hidden></a>
    <span class="pairs-tile" id="pairs-tile"></span>
  </div>
  <div id="auth" class="auth"></div>
</header>

<main>
  <section id="view-list" class="view"></section>
  <section id="view-card" class="view" hidden></section>
  <section id="view-stats" class="view" hidden></section>
  <section id="view-investors" class="view" hidden>
    <div class="empty"><h2>Inwestorzy</h2><p>Wkrótce.</p></div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p class="empty">Dashboard wymaga JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
