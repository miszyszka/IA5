<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA5 — laboratorium strategii FX</title>
<meta name="description" content="Szukanie i weryfikacja strategii FX na świecach H1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0E13'/%3E%3Cpath d='M6 22 L12 14 L17 18 L26 8' stroke='%23FF7A1A' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/echarts.min.js" defer></script>
<script src="vendor/lightweight-charts.js" defer></script>
</head>
<body>
<header class="top">
  <a class="logo" href="#/" aria-label="IA5 — strona główna"><span>IA5</span></a>
  <nav aria-label="Zakładki">
    <a data-tab="strategies" href="#/">Strategie</a>
    <a data-tab="investors" href="#/inwestorzy">Inwestorzy</a>
  </nav>
  <div id="auth" class="auth"></div>
</header>

<section id="status" class="status" aria-label="Stan systemu">
  <div class="kpi-tile" id="k-data" data-state="mute"><small>Dane (Yahoo → Firestore)</small><b class="v">…</b><span class="s"></span></div>
  <div class="kpi-tile" id="k-lat" data-state="plain"><small>Latencja ostatniej świecy</small><b class="v">—</b><span class="s"></span></div>
  <div class="kpi-tile" id="k-bars" data-state="plain"><small>Świece w bazie</small><b class="v">—</b><span class="s"></span></div>
  <div class="kpi-tile" id="k-mac" data-state="mute"><small>Mac (ia5 start)</small><b class="v">—</b><span class="s"></span></div>
  <div class="kpi-tile" id="k-flags" data-state="plain"><small>Flagi jakości danych</small><b class="v">—</b><span class="s"></span></div>
  <details class="pairs">
    <summary>Pary walutowe</summary>
    <div class="tablewrap"><table class="data compact">
      <thead><tr><th>Para</th><th>Ostatnia świeca (UTC)</th><th>Czas lokalny</th><th>Latencja s</th><th>Świece</th><th>Flagi</th></tr></thead>
      <tbody id="pairs-body"></tbody>
    </table></div>
  </details>
</section>

<main>
  <section id="view-list" class="view"></section>
  <section id="view-card" class="view" hidden></section>
  <section id="view-investors" class="view" hidden>
    <div class="empty"><h2>Inwestorzy</h2><p>Wkrótce.</p></div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p class="empty">Dashboard wymaga JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
