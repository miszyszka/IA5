[project]
name = "ia5"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "firebase-admin>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "TA-Lib>=0.6", "backtesting>=0.6"]

[project.scripts]
ia5 = "ia5.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ia5"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
