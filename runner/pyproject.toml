[project]
name = "ia5"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ia5 = "ia5.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ia5"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
